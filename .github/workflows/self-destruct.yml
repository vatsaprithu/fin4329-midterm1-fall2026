name: Self-destruct after Midterm 1

# Tuesday Oct 13, 2026 at 12:05 AM MT (Wed Oct 14, 06:05 UTC). GitHub may start scheduled
# jobs a few minutes late. Also runnable by hand from the Actions tab.
on:
  schedule:
    - cron: "5 6 14 10 *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  destroy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace the exam with a closed page
        run: |
          rm -f FIN4329_MT1_Exam.seb FIN4329_MT1_SetupCheck.seb quit.html
          cat > index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><meta name="robots" content="noindex,nofollow,noarchive">
          <title>Exam closed</title>
          <body style="font-family:Arial,sans-serif;padding:40px;background:#f7f9fc">
          <h1>FIN 4329 Midterm Exam 1 is closed</h1>
          <p>This exam ended on October 13, 2026. Contact your instructor with any questions.</p></body>
          HTML
          printf '# FIN 4329 Midterm 1 (closed)\n' > README.md
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Exam closed: remove exam content" || echo "already closed"
          git push
